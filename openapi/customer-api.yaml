openapi: 3.1.0
info:
  title: Amplify Customer API
  version: 1.0.0
  description: >-
    Source-of-truth contract for the live Amplify customer API. Endpoints are
    added in reviewed batches and should not be considered public until they
    appear in this document.
servers:
  - url: https://dev-api.amplify.xyz
    description: Development
tags:
  - name: Authentication
    description: Exchange an Amplify API key for an access token.
paths:
  /v1/auth:
    post:
      tags:
        - Authentication
      operationId: generateAccessToken
      summary: Generate an access token
      description: Exchanges an Amplify API key for a Bearer access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAccessTokenRequest"
            example:
              api_secret_key: <string>
      responses:
        "200":
          description: Access token generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateAccessTokenResponse"
              example:
                status: 1
                message: Token Generate Successfully
                data:
                  access_token: YOUR_ACCESS_TOKEN
                  token_type: Bearer
                  expires_in: 86400
        "401":
          description: The supplied API secret key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKeyResponse"
              example:
                status: 0
                message: API Secret Key is invalid.
  /v1/faxes/send:
    post:
      tags:
        - Faxes
      operationId: sendFax
      summary: Send a fax
      description: Sends a fax with one or more PDF documents supplied as JSON.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFaxJsonRequest"
      responses:
        "200":
          description: Fax submission accepted. The response body has not yet been provided in the customer collection.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    GenerateAccessTokenRequest:
      type: object
      additionalProperties: false
      required:
        - api_secret_key
      properties:
        api_secret_key:
          type: string
          description: API key created in the Amplify dashboard.
          example: <string>
    GenerateAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 1
        message:
          type: string
          example: Token Generate Successfully
        data:
          type: object
          additionalProperties: false
          required:
            - access_token
            - token_type
            - expires_in
          properties:
            access_token:
              type: string
              description: Bearer token used for subsequent API requests.
              example: YOUR_ACCESS_TOKEN
            token_type:
              type: string
              const: Bearer
            expires_in:
              type: integer
              description: Token lifetime in seconds.
              example: 86400
    InvalidApiKeyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: integer
          const: 0
        message:
          type: string
          const: API Secret Key is invalid.
    SendFaxJsonRequest:
      type: object
      additionalProperties: false
      properties:
        fax_number:
          type: string
          description: Destination fax number in E.164 format.
          pattern: '^\+[1-9][0-9]{1,14}$'
          example: "+12509997881"
        caller_id:
          type: string
          description: Caller ID or sending fax number in E.164 format.
          pattern: '^\+[1-9][0-9]{1,14}$'
          example: "+12513120176"
        template_id:
          type: string
          description: Template identifier.
          example: "1055"
        is_required_approval:
          type: string
          description: Approval indicator supplied by the customer collection.
          example: "1"
        fax_priority:
          type: string
          description: Fax priority.
          example: high
        smart_document_id:
          type: string
          description: Smart document identifier.
          example: "10210"
        subject:
          type: string
          description: Fax subject.
          example: Test Subject
        from_name:
          type: string
          description: Sender name.
          example: Sender Name
        to_name:
          type: string
          description: Recipient name.
          example: Recipient Name
        message:
          type: string
          description: Message associated with the fax.
          example: Fax sent through the Amplify API
        scheduled_date:
          type: string
          format: date-time
          description: Scheduled transmission date and time in ISO 8601 format.
          example: "2026-05-06T09:42:00Z"
        fax_quality:
          type: string
          description: Requested fax quality.
          enum:
            - low
            - standard
            - hd
          example: hd
        fax_data:
          type: array
          description: Documents to include in the fax.
          items:
            $ref: "#/components/schemas/SendFaxJsonDocument"
    SendFaxJsonDocument:
      type: object
      additionalProperties: false
      oneOf:
        - required:
            - file_data
        - required:
            - file_url
      properties:
        file_name:
          type: string
          description: Document file name.
          example: document.pdf
        file_data:
          type: string
          description: Base64-encoded contents of a PDF file.
        file_url:
          type: string
          format: uri
          description: Publicly accessible URL of a PDF file.
          example: https://example.com/document.pdf
