openapi: 3.1.0
info:
  title: Amplify Customer API
  version: 1.0.0
  description: |-
    Canonical contract for the Amplify customer-facing API. This YAML file is
    the source of truth for Postman and Mintlify. Operations marked with
    x-amplify-validation-status: pending were migrated from the legacy Postman
    collection and must be validated before their contract is considered final.
servers:
- url: https://api.amplify.xyz
  description: Production
tags:
- name: Authentication
- name: Fax
- name: Send Faxes
- name: Receive Faxes
- name: Manage Faxes
- name: Workspace
- name: Numbers
- name: Contacts
- name: Documents
- name: Templates
paths:
  "/v1/auth":
    post:
      tags:
      - Authentication
      operationId: generateAccessToken
      summary: Generate an access token
      description: Exchanges an Amplify API key for a Bearer access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GenerateAccessTokenRequest"
            example:
              api_secret_key: "<string>"
      responses:
        '200':
          description: Access token generated successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GenerateAccessTokenResponse"
              example:
                status: 1
                message: Token Generate Successfully
                data:
                  access_token: YOUR_ACCESS_TOKEN
                  token_type: Bearer
                  expires_in: 86400
        '401':
          description: The supplied API secret key is invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InvalidApiKeyResponse"
              example:
                status: 0
                message: API Secret Key is invalid.
      x-amplify-validation-status: validated
  "/v1/faxes/send":
    post:
      tags:
      - Send Faxes
      operationId: sendFax
      summary: Send a fax
      description: Sends a fax with one or more PDF documents supplied as JSON.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SendFaxJsonRequest"
            example:
              fax_number: "+12509997881"
              fax_data:
              - file_name: document.pdf
                file_url: https://example.com/document.pdf
      responses:
        '200':
          description: Fax processed for sending.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SendFaxResponse"
              example:
                status: 1
                message: Fax processed for sending
                data:
                  job_id: 01M1NMGG0WY0THD0YA3ZWN9WY7
        '401':
          "$ref": "#/components/responses/ExpiredAccessToken"
      x-amplify-validation-status: validated
  "/v1/faxes/forward":
    post:
      tags:
      - Send Faxes
      operationId: forwardFax
      summary: Forward a fax
      description: Forwards the documents from an existing fax job to another fax
        number.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForwardFaxRequest"
            example:
              job_id: '12345'
              fax_number: "+12509997881"
      responses:
        '200':
          description: Fax processed for sending.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ForwardFaxResponse"
              example:
                status: 1
                message: Fax processed for sending
                data:
                  job_id: 01M1NMGG0WY0THD0YA3ZWN9WY7
        '404':
          description: The source fax could not be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: Fax Not Found
      x-amplify-validation-status: validated
  "/v1/faxes/status":
    post:
      tags:
      - Send Faxes
      operationId: postv1FaxesStatus
      summary: Get fax status
      description: Returns the current transmission status and delivery details for
        the fax identified by job_id.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current fax status returned successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FaxStatusResponse"
              example:
                status: 1
                message: Fax status response.
                data:
                  job_id: 01M1NSAPE73ZJTEGEZQMHC8P6P
                  from_number: "+19073131400"
                  to_number: "+14084132233"
                  fax_call_length: 0
                  fax_call_start: 1788511347
                  fax_call_end:
                  fax_total_pages: 1
                  fax_transferred_pages: 1
                  fax_status: Sending
                  message: ''
                  code: 0
        '404':
          description: No fax record was found for the supplied job_id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FaxRecordNotFoundResponse"
              example:
                status: 0
                message: No record found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - job_id
              properties:
                job_id:
                  type: string
                  description: Unique identifier returned when the fax was submitted.
                  example: 01M1NSAPE73ZJTEGEZQMHC8P6P
            example:
              job_id: 01M1NSAPE73ZJTEGEZQMHC8P6P
      x-amplify-validation-status: validated
  "/v1/faxes/resend":
    post:
      tags:
      - Send Faxes
      operationId: resendFax
      summary: Resend a fax
      description: Resubmits a cancelled or failed fax identified by job_id and returns
        the same job_id after the fax is accepted for resending. Delivered faxes cannot
        be resent.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Fax processed for sending.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SendFaxResponse"
              example:
                status: 1
                message: Fax processed for sending
                data:
                  job_id: 01M1P3AW6FXWXQR6PHRRMYSC6M
        '400':
          description: The fax cannot be found or is not in a status that allows it
            to be resent.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResendFaxNotAllowedResponse"
              examples:
                ineligibleStatus:
                  summary: Fax status cannot be resent
                  value:
                    status: 0
                    message: 'Only cancelled or failed faxes can be resent. Current
                      status: delivered'
                faxNotFound:
                  summary: Fax does not exist or belongs to another account
                  value:
                    status: 0
                    message: Fax not found or does not belong to your account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - job_id
              properties:
                job_id:
                  type: string
                  description: Unique identifier of the fax to resend.
            example:
              job_id: 01KP352V1K013YQHRFS68NRV9F
      x-amplify-validation-status: validated
  "/v1/faxes/lists":
    post:
      tags:
      - Send Faxes
      operationId: listSentFaxes
      summary: List sent faxes
      description: Returns sent fax jobs in the authenticated account, including
        their transmission status, page counts, and cursor metadata.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sent fax list retrieved successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SentFaxListResponse"
              example:
                status: 1
                message: SentFax list retrieved successfully
                data:
                - id: 150004099
                  job_id: 01M1NSAPE73ZJTEGEZQMHC8P6P
                  sender: "+19073131400"
                  receiver: "+14084132233"
                  duration: ''
                  pages: 1
                  fax_status: Delivered
                  sent_fax_time: 1788511347
                  source: fax
                  sent_pages: 1
                  failed_pages: 0
                meta:
                  total: 17
                  next_cursor: ''
                  previous_cursor: ''
                  limit: 20
        '500':
          description: The server could not process the supplied request value.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InternalServerErrorResponse"
              example:
                status: 0
                message: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sort_by:
                  type: string
                  description: Sort order for the returned faxes. Newest is the confirmed
                    value.
            example:
              sort_by: Newest
      x-amplify-validation-status: validated
  "/v1/faxes/cancel-schedule":
    post:
      tags:
      - Send Faxes
      operationId: postv1FaxesCancelSchedule
      summary: Cancel a scheduled fax
      description: Cancels a scheduled fax before its scheduled transmission time.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The scheduled fax was cancelled successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 1
                message: Scheduled fax cancelled successfully
        '404':
          description: The fax could not be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: Fax not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id]
              properties:
                job_id:
                  type: string
                  description: Unique identifier of the scheduled fax to cancel.
            example:
              job_id: 01KM5FAY79TDPXDDXX1EW4QJ5M
      x-amplify-validation-status: validated
  "/v1/faxes/delete":
    delete:
      tags:
      - Manage Faxes
      operationId: deletev1FaxesDelete
      summary: Delete a fax
      description: Permanently deletes the fax identified by `job_id`.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The fax was deleted successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 1
                message: Fax deleted successfully
        '404':
          description: The fax could not be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: The fax doesn't exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id]
              properties:
                job_id:
                  type: string
                  description: Unique identifier of the fax to delete.
            example:
              job_id: 01KKB70Q219TKKBSW1VRQP1XZ0
      x-amplify-validation-status: validated
  "/v1/faxes/schedule":
    get:
      tags:
      - Send Faxes
      operationId: getv1FaxesSchedule
      summary: List scheduled faxes
      description: Returns faxes scheduled for future transmission in the authenticated
        account.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Scheduled fax list retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, meta]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    description: Omitted when no scheduled faxes are returned.
                    items:
                      type: object
                      properties:
                        job_id:
                          type: string
                        sender_number:
                          type: string
                        receiver_number:
                          type: string
                        pages:
                          type: integer
                        created_at:
                          type: integer
                          description: Unix timestamp returned by the current API implementation.
                        scheduled_time:
                          type: integer
                          description: Unix timestamp returned by the current API implementation.
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      next_cursor:
                        type: string
                      previous_cursor:
                        type: string
                      limit:
                        type: integer
              example:
                status: 1
                message: ScheduleFax list retrieved successfully
                data:
                - job_id: 01M1P48369SWFXQ84A789JED9V
                  sender_number: "+19073131400"
                  receiver_number: "+14084132233"
                  pages: 1
                  created_at: 1788522794
                  scheduled_time: 1791279720
                meta:
                  total: 1
                  next_cursor: ''
                  previous_cursor: ''
                  limit: 20
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of scheduled faxes to return.
        schema:
          type: integer
        example: 10
      - name: cursor
        in: query
        required: false
        description: Cursor used to request another page of results.
        schema:
          type: string
      x-amplify-validation-status: validated
  "/v1/faxes/pending-approval":
    post:
      tags:
      - Manage Faxes
      operationId: postv1FaxesPendingApproval
      summary: List pending fax approvals
      description: Returns faxes waiting for approval in the authenticated account.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Pending fax approvals retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, meta]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                    description: Omitted when no pending approvals are returned.
                  data:
                    type: array
                    description: Omitted when no pending approvals are returned.
                    items:
                      type: object
                      required: [job_id, fax_type, sender, receiver, pages, fax_status, created_at, updated_at]
                      properties:
                        job_id:
                          type: string
                        is_read:
                          type: boolean
                        fax_type:
                          type: string
                        sender:
                          type: string
                        receiver:
                          type: string
                        pages:
                          type: integer
                        fax_status:
                          type: string
                        created_at:
                          type: integer
                          description: Unix timestamp returned by the current API implementation.
                        updated_at:
                          type: integer
                          description: Unix timestamp returned by the current API implementation.
                  meta:
                    type: object
                    required: [total, next_cursor, previous_cursor, limit]
                    properties:
                      total:
                        type: integer
                      next_cursor:
                        type: string
                      previous_cursor:
                        type: string
                      limit:
                        type: integer
              examples:
                populated:
                  summary: Pending approval returned
                  value:
                    status: 1
                    message: Pending Approval Fax Rerive SuccessFully.
                    data:
                    - job_id: 01M1PEZPK67Z4RQ5Y82JZF3BCF
                      is_read: false
                      fax_type: outbound
                      sender: "+14084132233"
                      receiver: "+14084132233"
                      pages: 1
                      fax_status: pending_approval
                      created_at: 1788534052
                      updated_at: 1788534054
                    meta:
                      total: 1
                      next_cursor: ''
                      previous_cursor: ''
                      limit: 20
                empty:
                  summary: No pending approvals
                  value:
                    status: 1
                    meta:
                      total: 0
                      next_cursor: ''
                      previous_cursor: ''
                      limit: 10
        '422':
          description: A request value failed validation.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: The selected sort by is invalid.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sort_by:
                  type: string
            example:
              sort_by: Newest
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        example: 10
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      x-amplify-validation-status: validated
  "/v1/faxes/approval":
    post:
      tags:
      - Manage Faxes
      operationId: postv1FaxesApproval
      summary: Approve or reject a fax
      description: Approves or rejects one or more pending fax requests.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The pending fax request was processed successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 1
                message: The fax request has been successfully approved.
        '400':
          description: The fax request has already been approved.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: This fax has already been approved.
        '404':
          description: None of the supplied fax identifiers could be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: No faxes found for the provided UUIDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id, type]
              properties:
                job_id:
                  type: array
                  items:
                    type: string
                type:
                  type: string
                  description: Decision to apply to the pending fax request.
                  enum: [approve, reject]
                comment:
                  type: string
            example:
              job_id:
              - 01KRJFN3NFSF1DZYSQTCEA9NBC
              type: reject
              comment: Not Need To send this for now
      x-amplify-validation-status: validated
  "/v1/faxes/download":
    post:
      tags:
      - Manage Faxes
      operationId: postv1FaxesDownload
      summary: Download a fax
      description: Returns a fax document as a Base64-encoded PDF data URL.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Fax downloaded successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required: [name, file]
                    properties:
                      name:
                        type: string
                      file:
                        type: string
                        description: PDF represented as a Base64 data URL.
              example:
                status: 1
                message: The fax download successfully
                data:
                  name: file1
                  file: data:application/pdf;base64,<base64-encoded PDF>
        '404':
          description: The fax could not be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: Fax doesn't exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id]
              properties:
                job_id:
                  type: string
            example:
              job_id: 01KM5CRXJZSQNQSCX0W5CA9W17
      x-amplify-validation-status: validated
  "/v1/faxes/mark-as-done":
    post:
      tags:
      - Manage Faxes
      operationId: postv1FaxesMarkAsDone
      summary: Mark a fax as done
      description: Marks an inbound or outbound fax as done.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Fax marked as done successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 1
                message: Document marked as done successfully.
        '404':
          description: The fax could not be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: The Fax doesn't exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id, type]
              properties:
                job_id:
                  type: string
                type:
                  type: string
                  enum: [inbound, outbound]
            example:
              job_id: 01KM5D2STYZQ3QTA6BB2FMJ7TE
              type: inbound
      x-amplify-validation-status: validated
  "/v1/faxes/mark-as-not-done":
    post:
      tags:
      - Manage Faxes
      operationId: postv1FaxesMarkAsNotDone
      summary: Mark a fax as not done
      description: Marks an inbound or outbound fax as not done.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Fax marked as not done successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 1
                message: Document marked as un-done successfully.
        '404':
          description: The fax could not be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: The Fax doesn't exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id, type]
              properties:
                job_id:
                  type: string
                type:
                  type: string
                  enum: [inbound, outbound]
            example:
              job_id: 01KM5D2STYZQ3QTA6BB2FMJ7TE
              type: outbound
      x-amplify-validation-status: validated
  "/v1/faxes/transmission-receipt":
    post:
      tags:
      - Manage Faxes
      operationId: postv1FaxesTransmissionReceipt
      summary: Get a fax transmission receipt
      description: Returns a fax transmission receipt as a Base64-encoded PDF data URL.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Transmission receipt downloaded successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: string
                    description: PDF represented as a Base64 data URL.
              example:
                status: 1
                message: Transmission receipt downloaded successfully
                data: data:application/pdf;base64,<base64-encoded PDF>
        '404':
          description: The fax could not be found.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: Fax don`t exits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id, direction]
              properties:
                job_id:
                  type: string
                direction:
                  type: string
                  enum: [inbound, outbound]
            example:
              job_id: 01KKGWHA9ZES6M918QWHJPBPBB
              direction: outbound
      x-amplify-validation-status: validated
  "/v1/faxes/cancel":
    post:
      tags:
      - Send Faxes
      operationId: postv1FaxesCancel
      summary: Cancel a fax
      description: Cancels a fax that has not completed transmission.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The fax was cancelled successfully.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              example:
                status: 0
                message: Fax cancelled successfully
        '400':
          description: The fax could not be found or was already cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
              examples:
                faxNotFound:
                  summary: Fax not found
                  value:
                    status: 0
                    message: Fax not found
                alreadyCancelled:
                  summary: Fax is already cancelled
                  value:
                    status: 0
                    message: Fax is already cancelled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id]
              properties:
                job_id:
                  type: string
