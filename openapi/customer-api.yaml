components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    ExpiredAccessToken:
      description: The Bearer access token has expired.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ExpiredAccessTokenResponse"
          example:
            status: 401
            message: UNAUTHORIZED
            data: Token expired
  schemas:
    GenerateAccessTokenRequest:
      type: object
      additionalProperties: false
      required:
      - api_secret_key
      properties:
        api_secret_key:
          type: string
          description: API key created in the Amplify dashboard.
          example: "<string>"
    GenerateAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      - data
      properties:
        status:
          type: integer
          example: 1
        message:
          type: string
          example: Token Generate Successfully
        data:
          type: object
          additionalProperties: false
          required:
          - access_token
          - token_type
          - expires_in
          properties:
            access_token:
              type: string
              description: Bearer token used for subsequent API requests.
              example: YOUR_ACCESS_TOKEN
            token_type:
              type: string
              const: Bearer
            expires_in:
              type: integer
              description: Token lifetime in seconds.
              example: 86400
    InvalidApiKeyResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      properties:
        status:
          type: integer
          const: 0
        message:
          type: string
          const: API Secret Key is invalid.
    ExpiredAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      - data
      properties:
        status:
          type: integer
          const: 401
        message:
          type: string
          const: UNAUTHORIZED
        data:
          type: string
          const: Token expired
    SendFaxJsonRequest:
      type: object
      additionalProperties: false
      required:
      - fax_number
      - fax_data
      not:
        required:
        - template_id
        - smart_document_id
      properties:
        fax_number:
          type: string
          description: Destination fax number in E.164 format.
          pattern: "^\\+[1-9][0-9]{1,14}$"
          example: "+12509997881"
        caller_id:
          type: string
          description: Caller ID or sending fax number in E.164 format. When omitted,
            the value comes from the selected Fax Default or the account's default
            Fax Default.
          pattern: "^\\+[1-9][0-9]{1,14}$"
          example: "+12513120176"
        template_id:
          type: string
          description: ID of a Fax Default used as the cover-page template. Find it
            under Settings > iFax Settings > Fax Defaults. Cannot be combined with
            smart_document_id.
          example: '1055'
        is_required_approval:
          type: boolean
          description: Whether the fax requires approval before it is sent.
          example: false
        fax_priority:
          type: string
          description: Fax priority.
          enum:
          - high
          - regular
          default: regular
          example: high
        smart_document_id:
          type: string
          description: ID of a Smart Template. Find it under Settings > iFax Settings
            > Smart Templates. Cannot be combined with template_id.
          example: '10210'
        subject:
          type: string
          description: Fax subject.
          example: Test Subject
        from_name:
          type: string
          description: Sender name.
          example: Sender Name
        to_name:
          type: string
          description: Recipient name.
          example: Recipient Name
        message:
          type: string
          description: Message associated with the fax.
          example: Fax sent through the Amplify API
        scheduled_date:
          type: string
          format: date-time
          description: Scheduled transmission date and time in ISO 8601 format.
          example: '2026-05-06T09:42:00Z'
        fax_quality:
          type: string
          description: Requested fax quality. When omitted, the value comes from the
            selected Fax Default or the account's default Fax Default.
          enum:
          - low
          - standard
          - hd
          example: hd
        fax_data:
          type: array
          description: Documents to include in the fax.
          minItems: 1
          items:
            "$ref": "#/components/schemas/SendFaxJsonDocument"
    SendFaxJsonDocument:
      type: object
      additionalProperties: false
      oneOf:
      - required:
        - file_data
      - required:
        - file_url
      required:
      - file_name
      properties:
        file_name:
          type: string
          description: Document file name.
          example: document.pdf
        file_data:
          type: string
          description: Base64-encoded contents of a PDF file.
        file_url:
          type: string
          format: uri
          description: Publicly accessible URL of a PDF file.
          example: https://example.com/document.pdf
    SendFaxResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      - data
      properties:
        status:
          type: integer
          const: 1
        message:
          type: string
          const: Fax processed for sending
        data:
          type: object
          additionalProperties: false
          required:
          - job_id
          properties:
            job_id:
              type: string
              description: Unique identifier for the submitted fax job.
              example: 01M1NMGG0WY0THD0YA3ZWN9WY7
    ForwardFaxRequest:
      type: object
      additionalProperties: false
      required:
      - job_id
      - fax_number
      properties:
        job_id:
          type: string
          description: ID of the existing fax job whose documents will be forwarded.
          example: '12345'
        fax_number:
          type: string
          description: Destination fax number in E.164 format.
          pattern: "^\\+[1-9][0-9]{1,14}$"
          example: "+12509997881"
        caller_id:
          type: string
          description: Caller ID in E.164 format. When omitted, the account's default
            fax_as value is used.
          pattern: "^\\+[1-9][0-9]{1,14}$"
          example: "+12513120176"
    ForwardFaxResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      - data
      properties:
        status:
          type: integer
          const: 1
        message:
          type: string
          const: Fax processed for sending
        data:
          type: object
          additionalProperties: false
          required:
          - job_id
          properties:
            job_id:
              type: string
              description: ID of the new fax job created by the forward operation.
              example: 01M1NMGG0WY0THD0YA3ZWN9WY7
    FaxStatusResponse:
      type: object
      required:
      - status
      - message
      - data
      properties:
        status:
          type: integer
          const: 1
        message:
          type: string
          const: Fax status response.
        data:
          type: object
          required:
          - job_id
          - from_number
          - to_number
          - fax_call_length
          - fax_call_start
          - fax_call_end
          - fax_total_pages
          - fax_transferred_pages
          - fax_status
          - message
          - code
          properties:
            job_id:
              type: string
              description: Unique identifier for the fax job.
            from_number:
              type: string
              description: Sending fax number in E.164 format.
              pattern: "^\\+[1-9][0-9]{1,14}$"
            to_number:
              type: string
              description: Destination fax number in E.164 format.
              pattern: "^\\+[1-9][0-9]{1,14}$"
            fax_call_length:
              type: integer
              description: Current call duration in seconds.
            fax_call_start:
              type: integer
              description: Transmission start time represented as a Unix timestamp.
            fax_call_end:
              type:
              - integer
              - 'null'
              description: Transmission end time represented as a Unix timestamp,
                or null while the fax is in progress.
            fax_total_pages:
              type: integer
              description: Total number of pages in the fax.
            fax_transferred_pages:
              type: integer
              description: Number of pages transferred so far.
            fax_status:
              type: string
              description: Current transmission status.
            message:
              type: string
              description: Status detail supplied by the fax service.
            code:
              type: integer
              description: Status code supplied by the fax service.
    FaxRecordNotFoundResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      properties:
        status:
          type: integer
          const: 0
        message:
          type: string
          const: No record found
    ResendFaxNotAllowedResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      properties:
        status:
          type: integer
          const: 0
        message:
          type: string
          description: Explains why the fax cannot be resent.
    SentFaxListResponse:
      type: object
      required:
      - status
      - message
      - data
      - meta
      properties:
        status:
          type: integer
          const: 1
        message:
          type: string
          const: SentFax list retrieved successfully
        data:
          type: array
          items:
            "$ref": "#/components/schemas/SentFaxListItem"
        meta:
          "$ref": "#/components/schemas/CursorPaginationMeta"
    SentFaxListItem:
      type: object
      required:
      - id
      - job_id
      - sender
      - receiver
      - duration
      - pages
      - fax_status
      - sent_fax_time
      - source
      properties:
        id:
          type: integer
          description: Internal numeric identifier for the fax record.
        job_id:
          type: string
          description: Public identifier for the fax job.
        sender:
          type: string
          description: Sending fax number in E.164 format.
        receiver:
          type: string
          description: Destination fax number in E.164 format.
        duration:
          type: string
          description: Transmission duration as returned by the service.
        pages:
          type: integer
          description: Total number of pages in the fax.
        fax_status:
          type: string
          description: Current fax status.
        sent_fax_time:
          type: integer
          description: Sent time represented as a Unix timestamp.
        source:
          type: string
          description: Source that created the fax.
        sent_pages:
          type: integer
          description: Number of pages sent successfully. This field may be absent
            for pending faxes.
        failed_pages:
          type: integer
          description: Number of pages that failed. This field may be absent for pending
            faxes.
    CursorPaginationMeta:
      type: object
      required:
      - total
      - next_cursor
      - previous_cursor
      - limit
      properties:
        total:
          type: integer
          description: Total number of matching records.
        next_cursor:
          type: string
          description: Cursor for the next page, or an empty string when unavailable.
        previous_cursor:
          type: string
          description: Cursor for the previous page, or an empty string when unavailable.
        limit:
          type: integer
          description: Maximum records returned in this response.
    InternalServerErrorResponse:
