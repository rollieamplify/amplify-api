  "/v1/ai/extract":
    post:
      tags:
      - Fax
      operationId: postv1AiExtract
      summary: Extract OCR and NLP data
      description: Returns previously generated OCR or NLP data for a fax. The response data shape depends on the requested processing type.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The requested OCR or NLP data was retrieved successfully. This example shows an NLP response; OCR returns a different `json_text` shape.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required: [json_text]
                    properties:
                      json_text:
                        description: Extracted data whose structure depends on whether `type` is `OCR` or `NLP`.
                        oneOf:
                        - type: object
                          description: NLP result object.
                          additionalProperties: true
                        - type: array
                          description: OCR blocks detected in the fax document.
                          items:
                            type: object
                            additionalProperties: true
              examples:
                nlp:
                  summary: Shortened NLP response
                  value:
                    status: 1
                    message: JSON NLP data retrieved successfully.
                    data:
                      json_text:
                        task_id: 8cd23e57-ed34-49fd-a81c-ca068a263076
                        action: combined
                        status: success
                        DPI: '200'
                        result_type: object
                        result:
                          document_type:
                            overall:
                              class: Other
                              confidence: 0
                              index: -1
                        errors: []
                ocr:
                  summary: Shortened OCR response
                  value:
                    status: 1
                    message: JSON OCR data retrieved successfully.
                    data:
                      json_text:
                      - BlockType: PAGE
                        Id: 0faea376-249c-4c4f-bb6f-a70241af2d65
                        Page: 1
                        Geometry:
                          BoundingBox:
                            Width: 1
                            Height: 1
                            Left: 0
                            Top: 0
                      - BlockType: LINE
                        Confidence: 100
                        Text: FAX
                        Id: 27f2be95-f9d5-494b-80bd-643d75d10bc3
                        Page: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id, direction, type]
              properties:
                job_id:
                  type: string
                  description: Unique identifier of the fax whose extracted data is returned.
                direction:
                  type: string
                  description: Direction of the fax whose extracted data is returned.
                  enum: [inbound, outbound]
                type:
                  type: string
                  description: Case-sensitive extraction type.
                  enum: [OCR, NLP]
            example:
              job_id: 01KKXJMQMDZ6JAFVHCEG9TZ65M
              direction: outbound
              type: NLP
      x-amplify-validation-status: pending
